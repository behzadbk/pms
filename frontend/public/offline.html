<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عدم اتصال به اینترنت</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f5f7;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        color: #1d2733;
      }
      .box { text-align: center; max-width: 320px; padding: 24px; }
      .icon {
        width: 56px; height: 56px; margin: 0 auto 16px;
        border-radius: 16px; background: #16324f;
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 24px;
      }
      h1 { font-size: 16px; margin: 0 0 8px; }
      p { font-size: 13px; color: #64748b; line-height: 1.8; margin: 0; }
      button {
        margin-top: 20px; background: #0e9594; color: white; border: none;
        padding: 10px 20px; border-radius: 12px; font-size: 13px; cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">⌂</div>
      <h1>در حال حاضر آفلاین هستید</h1>
      <p>اتصال اینترنت برقرار نیست. برخی صفحاتی که قبلاً باز کرده‌اید ممکن است از حافظه محلی در دسترس باشند.</p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
