# ساخت اپ موبایل (Capacitor) — APK اندروید و IPA آیفون
# اجرا: خودکار روی push به main در صورت تغییر frontend، یا دستی از تب Actions → "Mobile apps" → Run workflow
# خروجی‌ها در انتهای هر اجرا در بخش Artifacts قابل دانلود هستند.
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'آدرس API سرور (پیش‌فرض از frontend/.env.mobile)'
        required: false
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/mobile.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Android SDK روی runner ubuntu-latest از قبل نصب است (ANDROID_HOME)؛ setup-android@v3 با cmdline-tools جدید خطا می‌داد
      - run: npm ci
      - name: Override API URL
        if: ${{ inputs.api_base_url != '' }}
        run: echo "VITE_API_BASE_URL=${{ inputs.api_base_url }}" > .env.mobile.local
      - run: npm run mobile:build
      - name: Build debug APK (قابل نصب مستقیم)
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Build signed release APK + AAB (اگر Secrets کلید امضا تنظیم شده باشد)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: frontend/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            frontend/android/app/build/outputs/apk/**/*.apk
            frontend/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Override API URL
        if: ${{ inputs.api_base_url != '' }}
        run: echo "VITE_API_BASE_URL=${{ inputs.api_base_url }}" > .env.mobile.local
      - run: npm run mobile:build
      - name: Build unsigned IPA
        working-directory: frontend/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app output/Payload/
          cd output && zip -qr PMS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: frontend/ios/App/output/PMS-unsigned.ipa
          if-no-files-found: error
