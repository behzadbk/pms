# ============================================================================
# کاتالوگ قابلیت‌های پروژه (همین) — نسخه‌ی بتا
# ============================================================================
# منبع واحد حقیقت برای «هر چیزی که در یک برج قابل‌تنظیم است».
# - انسان آن را می‌خواند و ویرایش می‌کند (YAML).
# - catalog/build.py آن را اعتبارسنجی می‌کند و catalog.json می‌سازد.
# - catalog/validate.py آن را با کد واقعی مقایسه می‌کند (سطح‌ها، نقش‌ها، بخش‌ها ...)؛
#   اگر قابلیتی در کد باشد و در کاتالوگ نه (یا برعکس) بیلد می‌شکند.
# - هوش مصنوعی فقط از روی همین کاتالوگ «انتخاب» می‌کند؛ هیچ آیتم تازه‌ای نمی‌سازد.
version: "0.1.0-beta"

# وضعیت هر آیتم
statuses:
  implemented: منطق بک‌اند نوشته و در این بتا بررسی شده است
  partial: بخشی از آن کار می‌کند؛ توضیح در note آمده است
  unverified: در ماتریس سطح‌ها هست ولی منطق بک‌اندش هنوز در این بتا بررسی نشده
  planned: در کد نیست؛ برای نقشه‌ی راه ثبت شده است

# نوع مقدار
types:
  boolean: روشن/خاموش
  integer: عدد صحیح
  number: عدد اعشاری
  money: مبلغ به تومان
  percent: درصد (۰ تا ۱۰۰)
  enum: یک مقدار از فهرست
  multi_enum: چند مقدار از فهرست
  string: متن کوتاه
  list: فهرست اعداد
  fixed: قانون ثابت سیستم؛ قابل‌تغییر نیست (فقط برای اطلاع)

# سطح‌های سرویس: تعریف دقیق در backend/identity-service/src/platform/tiers.ts
tiers:
  simple: ساده
  economic: اقتصادی
  professional: حرفه‌ای

domains:
  feature: ماژول‌ها (روشن/خاموش)
  finance: مالی و شارژ
  debtor: قوانین بدهکاری
  amenity: مشاعات و رزرو
  service: خدمات (مهمان، مرسوله، غذا، اعلان)
  people: نقش‌ها، کارکنان و ساکنان
  building: قوانین کلی ساختمان
