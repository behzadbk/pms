server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip برای assetهای استاتیک (فونت/JS/CSS)
  gzip on;
  gzip_types text/css application/javascript application/json font/woff2;
  gzip_min_length 1024;

  # ---- Service Worker: هرگز نباید کش شود، وگرنه به‌روزرسانی PWA به کاربر نمی‌رسد ----
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /offline.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # assetهای build شده Vite نام‌فایل hash‌دار دارند -> کش طولانی‌مدت امن است
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /icons/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # SPA fallback — هر مسیر ناشناخته به index.html برمی‌گردد (React Router مسیر را در کلاینت مدیریت می‌کند)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
