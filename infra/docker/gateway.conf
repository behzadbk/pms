# gateway.conf — تنها نقطه‌ی ورود سامانه در اجرای Docker Compose (معادل Ingress در Kubernetes)
#
#   /                 → frontend:8080         (PWA)
#   /api/<service>/…  → <service>-svc:<port>  (پیشوند /api/<service> حذف می‌شود، مثل rewrite-target در ingress.yaml)
#   /socket.io/       → fnb-svc:3008          (WebSocket زنده‌ی سفارش غذا، namespace /fnb-live)
#
# resolver داخلی Docker + متغیر در proxy_pass: اگر یک سرویس ری‌استارت شود و IP جدید بگیرد،
# gateway آن را دوباره پیدا می‌کند و نیازی به ری‌استارت nginx نیست؛ و اگر سرویسی هنوز بالا
# نیامده باشد nginx موقع استارت کرش نمی‌کند (فقط همان مسیر 502 می‌دهد).

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---- محدودسازی نرخ (ضد brute-force / DoS) ----
# کلید = IP واقعی کلاینت. این gateway نقطه‌ی ورود است، پس $binary_remote_addr همان کلاینت است.
# api: مصرف عادی اپ (polling داشبوردها) را راحت عبور می‌دهد؛ auth: مسیرهای ورود/عضویت/کد خانواده بسیار سخت‌گیرانه‌تر.
# (قفل نمایی حساب در خود identity-service هم هست؛ این لایه جلوی سیلِ درخواست قبل از رسیدن به bcrypt/DB را می‌گیرد.)
limit_req_zone  $binary_remote_addr zone=pms_api:20m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=pms_auth:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=pms_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# HSTS فقط وقتی درخواست واقعاً روی HTTPS آمده (پشت TLS terminator / Caddy / LB)؛ روی HTTP خالی = هدر ارسال نمی‌شود
map $http_x_forwarded_proto $pms_hsts {
  default '';
  https   'max-age=31536000; includeSubDomains';
}

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;   # عکس بسته‌های پستی (guard) و پیوست‌ها

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;
  proxy_read_timeout 120s;

  # نسخه‌ی nginx در هدر/صفحات خطا لو نرود
  server_tokens off;
  # هدر لوکیشن داخلی/فریم‌ورک سرویس‌ها به بیرون نرسد
  proxy_hide_header X-Powered-By;

  limit_conn pms_conn 60;

  # ---- هدرهای امنیتی (always = روی پاسخ‌های خطا هم) ----
  # CSP: اپ فقط از مبدأ خودش اسکریپت می‌گیرد (index.html اسکریپت inline ندارد و injectRegister=false است)؛
  # عکس‌ها ممکن است از https خارجی (عکس بسته) باشند. frame-ancestors 'none' = ضد clickjacking.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security $pms_hsts always;

  # ---- مسیرهای حساس احراز هویت: نرخ بسیار پایین‌تر ----
  # ورود، refresh، کد خانواده، عضویت با لینک/دعوت (این‌ها بین همه‌ی tenantها جست‌وجو می‌کنند → هدف DoS/شمارش).
  # سقف ۳۰/دقیقه + burst ۳۰ برای هر IP: ساکنان یک ساختمان پشت یک IP (وای‌فای مشترک) هم مشکلی نمی‌خورند.
  location ~ ^/api/identity/(auth/(login|platform-login|refresh|family-code)$|join/[^/]+$|invites/[^/]+(/accept)?$) {
    limit_req zone=pms_auth burst=30 nodelay;
    set $up identity-svc:3001; rewrite ^/api/identity(/.*)$ $1 break; proxy_pass http://$up;
  }

  # ---- API: /api/<service>/<rest> → http://<service>-svc:<port>/<rest> ----
  limit_req zone=pms_api burst=60 nodelay;

  location /api/identity/ { set $up identity-svc:3001; rewrite ^/api/identity(/.*)$ $1 break; proxy_pass http://$up; }
  location /api/property/ { set $up property-svc:3002; rewrite ^/api/property(/.*)$ $1 break; proxy_pass http://$up; }
  location /api/facility/ { set $up facility-svc:3003; rewrite ^/api/facility(/.*)$ $1 break; proxy_pass http://$up; }
  location /api/finance/ { set $up finance-svc:3004; rewrite ^/api/finance(/.*)$ $1 break; proxy_pass http://$up; }
  location /api/guard/ { set $up guard-svc:3005; rewrite ^/api/guard(/.*)$ $1 break; proxy_pass http://$up; }
  location /api/notification/ { set $up notification-svc:3006; rewrite ^/api/notification(/.*)$ $1 break; proxy_pass http://$up; }
  location /api/audit/ { set $up audit-svc:3007; rewrite ^/api/audit(/.*)$ $1 break; proxy_pass http://$up; }
  location /api/fnb/ { set $up fnb-svc:3008; rewrite ^/api/fnb(/.*)$ $1 break; proxy_pass http://$up; }

  # ---- WebSocket زنده (socket.io) ----
  location /socket.io/ { set $up fnb-svc:3008; proxy_pass http://$up; }

  # ---- فرانت‌اند (PWA) — کش و SPA fallback را nginx داخل کانتینر frontend مدیریت می‌کند ----
  location / { set $up frontend:8080; proxy_pass http://$up; }
}
