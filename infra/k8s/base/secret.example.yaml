# ⚠️ این فایل یک TEMPLATE است، نه یک Secret واقعی — هرگز مقدار واقعی رمز را commit نکنید.
# در Production واقعی: از External Secrets Operator + Vault/AWS Secrets Manager/GCP Secret Manager
# استفاده کنید تا مقادیر از یک منبع امن مرکزی sync شوند، نه این‌که در Git ذخیره شوند.
# برای محیط توسعه/دمو محلی، این فایل را کپی کرده و مقادیر واقعی را با:
#   kubectl create secret generic pms-secrets --from-env-file=.env.secrets -n pms-prod
# بسازید (نه با apply مستقیم این فایل).

apiVersion: v1
kind: Secret
metadata:
  name: pms-secrets
  namespace: pms-prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql://app_user:CHANGE_ME@postgres.pms-prod.svc.cluster.local:5432/pms"
  DATABASE_PLATFORM_URL: "postgresql://platform_admin:CHANGE_ME@postgres.pms-prod.svc.cluster.local:5432/pms"
  JWT_SECRET: "CHANGE_ME_MIN_32_CHAR_RANDOM_STRING"
  JWT_PUBLIC_KEY: ""
  PAYMENT_GATEWAY_SECRET: "CHANGE_ME"
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  SMS_PROVIDER_API_KEY: "CHANGE_ME"
