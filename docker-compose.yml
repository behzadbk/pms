# ─────────────────────────────────────────────────────────────────────────────
#  همین (Hamin) PMS — کل سامانه روی یک سرور، با Docker Compose
#
#  این فایل را مستقیم اجرا نکنید؛ sudo bash install.sh همه‌چیز را به‌ترتیب انجام می‌دهد:
#    زیرساخت (postgres, rabbitmq, redis) → مایگریشن دیتابیس → ۸ سرویس → فرانت‌اند → gateway
#
#  همه‌ی تنظیمات و رمزها از فایل .env (کنار همین فایل) خوانده می‌شود —
#  install.sh اگر .env نباشد آن را با رمزهای تصادفی می‌سازد.
#
#  تنها پورتی که بیرون باز می‌شود HTTP_PORT (پیش‌فرض 80) روی gateway است:
#    /                → فرانت‌اند (PWA)
#    /api/<service>/  → میکروسرویس مربوطه
#    /socket.io/      → WebSocket زنده‌ی fnb (سفارش غذا)
# ─────────────────────────────────────────────────────────────────────────────

name: pms

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  networks: [pms]

x-build-args: &build-args
  NPM_REGISTRY: ${NPM_REGISTRY:-}

x-common-env: &common-env
  NODE_ENV: production
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET در .env تنظیم نشده}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-pms}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD در .env تنظیم نشده}@rabbitmq:5672
  CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}

services:
  # ───────────── زیرساخت ─────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD در .env تنظیم نشده}
      POSTGRES_DB: pms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [pms]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [pms]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [pms]

  # ───────────── مایگریشن (یک‌بار اجرا می‌شود، install.sh صدایش می‌زند) ─────────────
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/pms
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD در .env تنظیم نشده}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD در .env تنظیم نشده}
    networks: [pms]

  # ───────────── ۸ میکروسرویس NestJS ─────────────
  identity-svc:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nestjs
      args: { <<: *build-args, SERVICE_PATH: backend/identity-service }
    environment:
      <<: *common-env
      PORT: "3001"
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/pms?schema=identity

  property-svc:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nestjs
      args: { <<: *build-args, SERVICE_PATH: backend/property-service }
    environment:
      <<: *common-env
      PORT: "3002"
      GRPC_PORT: "50052"
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/pms?schema=property

  facility-svc:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nestjs
      args: { <<: *build-args, SERVICE_PATH: backend/facility-service }
    environment:
      <<: *common-env
      PORT: "3003"
      PROPERTY_SVC_GRPC_URL: property-svc:50052
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/pms?schema=facility

  finance-svc:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nestjs
      args: { <<: *build-args, SERVICE_PATH: backend/finance-service }
    environment:
      <<: *common-env
      PORT: "3004"
      PROPERTY_SVC_GRPC_URL: property-svc:50052
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/pms?schema=finance

  guard-svc:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nestjs
      args: { <<: *build-args, SERVICE_PATH: backend/guard-service }
    environment:
      <<: *common-env
      PORT: "3005"
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/pms?schema=guard

  notification-svc:
    <<: *service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nestjs
      args: { <<: *build-args, SERVICE_PATH: backend/notification-service }
    environment:
      <<: *common-env
      PORT: "3006"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/pms?schema=notification

  audit-svc:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nestjs
      args: { <<: *build-args, SERVICE_PATH: backend/audit-service }
    environment:
      <<: *common-env
      PORT: "3007"
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/pms?schema=audit

  fnb-svc:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nestjs
      args: { <<: *build-args, SERVICE_PATH: backend/fnb-service }
    environment:
      <<: *common-env
      PORT: "3008"
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/pms?schema=fnb

  # ───────────── فرانت‌اند و gateway ─────────────
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        <<: *build-args
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    networks: [pms]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - identity-svc
      - property-svc
      - facility-svc
      - finance-svc
      - guard-svc
      - notification-svc
      - audit-svc
      - fnb-svc
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [pms]

networks:
  pms:

volumes:
  pgdata:
  rabbitmq:
  redis:
